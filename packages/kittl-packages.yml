notes: >-
  Kittl publishes a first-party app/extension developer platform under the @kittl npm
  scope. The SDK, CLI, backend helpers, app templates and UI kit are the official
  developer-facing libraries; they are the client surface for building sandboxed apps
  that run inside the Kittl editor. The @kittl scope also carries a number of vendored
  forks of third-party graphics libraries (fontkit, pdfkit, paper.js, tinycolor2,
  little-cms, jSquash png/jpeg, nprogress, svg-to-pdfkit, node-redlock) which are
  republished upstream projects rather than Kittl client libraries — those are listed
  separately under vendored_forks and are NOT marked official client SDKs.
  The source repository referenced by the CLI and create-app packages
  (github.com/Kittl/sandboxed-extensions) is not publicly accessible (404) as of this
  pass; the developer platform is in beta and requires account approval for app creation.
