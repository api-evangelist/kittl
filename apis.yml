aid: kittl
name: Kittl
description: >-
  Kittl is a Berlin-based, browser-based graphic design platform positioned for
  commerce-driven creative workflows — "Canva is for content, Kittl is for commerce." It
  serves small business owners, Shopify and Etsy sellers, print-on-demand businesses, DTC
  brands, freelancers, agencies and small creative teams, covering branding, packaging,
  product imagery, marketing campaigns, merchandise, labels, mockups and digital assets
  with AI-assisted creative workflows. For developers, Kittl runs an app/extension
  platform: sandboxed web apps run in an isolated iframe inside the Kittl editor and
  integrate with editor APIs over postMessage through the official @kittl/sdk JavaScript
  SDK, governed by a declared scope set in manifest.json and shipped through the
  @kittl/cli toolchain. The platform is in beta and account approval is required to
  create apps.
