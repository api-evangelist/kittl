apis:
- aid: kittl:sdk
  name: Kittl SDK & App Platform
  description: >-
    The Kittl SDK is the bridge between a sandboxed app and the Kittl editor host. It
    exposes async namespaces — kittl.design for design operations, kittl.state for editor
    and app state, kittl.upload for image uploads, kittl.data for the font and mockup
    catalogs, kittl.ai for credit-metered generation, and kittl.auth for OAuth helper
    flows. Every call returns an SdkResult envelope ({ isOk, result, error }). Access is
    governed by a static scope set declared in manifest.json config.scopes and enforced
    by the host at call time. Apps are packaged and released through the Kittl CLI
    against an immutable, admin-reviewed version.
  humanURL: https://sdk-docs.kittl.dev/
  baseURL: https://api.kittl.com
