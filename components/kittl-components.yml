  url: https://www.npmjs.com/package/@kittl/ui-react
  description: React wrapper for Kittl UI components.
- package: '@kittl/ui-icons'
  registry: npm
  url: https://www.npmjs.com/package/@kittl/ui-icons
  description: Icon collection used across Kittl's UI.
  docs: https://sdk-docs.kittl.dev/Icons/
- package: '@kittl/ui-tokens'
  registry: npm
  url: https://www.npmjs.com/package/@kittl/ui-tokens
  description: Design tokens backing the UI kit.
