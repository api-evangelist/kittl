editor_surfaces:
  note: >-
    Beyond the UI kit, the manifest declares where an app mounts inside the editor.
  surfaces:
  - name: mainAppPanel
    manifest_path: config.embed.mainAppPanel.path
    description: HTML entrypoint for the app's visible main panel.
    required: true
  - name: scriptRunner
    manifest_path: config.embed.scriptRunner.path
    description: >-
